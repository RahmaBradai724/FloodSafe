<title>FloodSafe : interfaces clair et sombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9ebf0; }
  body { font: 13px/1.4 "Inter", system-ui, sans-serif; color: #14161c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; padding: 26px 32px; position: relative; overflow: hidden; page-break-after: always; break-after: page; background: #f6f7fa; }
  .page:last-child { page-break-after: auto; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .page-head p { margin: 4px 0 0; color: #5b6170; max-width: 640px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6170; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatches i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatches small { margin-left: 8px; color: #5b6170; }
  .row { display: flex; gap: 14px; justify-content: space-between; }
  .shot { display: grid; gap: 8px; justify-items: center; }
  .shot figcaption { font-size: 12px; font-weight: 600; color: #3b4150; }
  .shot figcaption span { display: block; font-weight: 400; color: #747a88; text-align: center; }
  figure { margin: 0; }

  /* phone frame */
  .phone { zoom: .7; width: 284px; height: 584px; border-radius: 44px; background: #0d0f14; padding: 7px; box-shadow: 0 18px 40px rgba(15,20,40,.22); }
  .screen { position: relative; width: 270px; height: 570px; border-radius: 37px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .notch { position: absolute; z-index: 30; top: 9px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #000; }
  .status { position: absolute; z-index: 29; top: 0; left: 0; right: 0; height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font: 600 12px var(--font); color: var(--status, var(--ink)); }
  .homebar { position: absolute; z-index: 30; bottom: 7px; left: 50%; transform: translateX(-50%); width: 96px; height: 4px; border-radius: 3px; background: var(--ink); opacity: .55; }
  .map { position: absolute; inset: 0; }

  /* shared pieces, styled by the direction's variables */
  .sheet { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: var(--r) var(--r) 0 0; padding: 10px 16px 22px; box-shadow: 0 -10px 30px rgba(10,20,40,.12); }
  .grab { width: 36px; height: 4px; border-radius: 3px; background: var(--line2); margin: 0 auto 10px; }
  .h { font-weight: 700; font-size: 15px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .chips { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); }
  .chip.on { background: var(--p); color: var(--on-p); border-color: var(--p); }
  .chip svg { width: 11px; height: 11px; }
  .btn { display: flex; justify-content: center; align-items: center; gap: 6px; height: 40px; border-radius: var(--btnr); background: var(--p); color: var(--on-p); font-weight: 700; font-size: 13px; }
  .btn.ghost { background: transparent; color: var(--p); border: 1.5px solid var(--line2); }
  .field { height: 40px; border-radius: var(--fieldr); background: var(--field); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--muted); margin-bottom: 9px; }
  .field svg { width: 14px; height: 14px; color: var(--muted); }
  .label { font-size: 10.5px; font-weight: 600; margin: 0 0 4px 2px; color: var(--ink); }
  .card { border-radius: var(--cr); border: 1px solid var(--line); background: var(--surface2); padding: 10px 11px; }
  .rcard { display: grid; grid-template-columns: 34px 1fr auto; gap: 9px; align-items: center; margin-bottom: 7px; }
  .rcard.sel { border: 1.5px solid var(--p); box-shadow: 0 0 0 3px var(--p-soft); }
  .ricon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--p-soft); color: var(--p); }
  .ricon svg { width: 17px; height: 17px; }
  .rt { font-weight: 700; font-size: 12.5px; }
  .rs { font-size: 10px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 1px; }
  .rv { text-align: right; font-weight: 700; font-size: 12.5px; }
  .rv small { display: block; font-weight: 500; font-size: 10px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .gauge { height: 7px; border-radius: 5px; background: var(--line); position: relative; margin: 7px 0 4px; }
  .gauge b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--p); }
  .gauge i { position: absolute; top: -3px; width: 2px; height: 13px; background: var(--ink); left: 66.6%; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .float { position: absolute; z-index: 12; }
  .fab { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: 0 6px 18px rgba(10,20,40,.16); }
  .fab svg { width: 16px; height: 16px; }
  .notif { position: absolute; z-index: 25; top: 44px; left: 10px; right: 10px; border-radius: 20px; padding: 10px 12px; display: grid; grid-template-columns: 30px 1fr; gap: 9px; background: var(--notif-bg); color: var(--notif-ink); box-shadow: 0 14px 34px rgba(0,0,0,.28); backdrop-filter: blur(14px); }
  .notif .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--p); color: var(--on-p); }
  .notif .ico svg { width: 16px; height: 16px; }
  .notif b { font-size: 11.5px; }
  .notif p { margin: 1px 0 0; font-size: 10.5px; opacity: .85; }
  .notif small { float: right; opacity: .6; font-size: 10px; }
  .report { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .report div { border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-size: 10px; font-weight: 600; padding: 8px 4px; text-align: center; display: grid; gap: 4px; justify-items: center; }

  .reasons { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
  .reasons span { font-size: 10.5px; font-weight: 600; padding: 5px 9px; border-radius: 9px; background: var(--p-soft); color: var(--p); }
  .kv { display: flex; justify-content: space-between; font-size: 11px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border: 0; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; }
  .logo i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--p); color: var(--on-p); }
  .logo i svg { width: 16px; height: 16px; }

  /* desktop frame (admin) */
  .desk { zoom: .74; width: 1360px; height: 860px; border-radius: 18px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); box-shadow: 0 24px 60px rgba(15,20,40,.22); display: grid; grid-template-columns: 220px 1fr; border: 1px solid rgba(0,0,0,.06); }
  .side { background: var(--side); color: var(--side-ink); padding: 22px 16px; display: grid; align-content: start; gap: 4px; }
  .side .logo { color: var(--side-ink); margin-bottom: 22px; font-size: 18px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500; opacity: .78; }
  .nav.on { background: var(--side-on); opacity: 1; font-weight: 700; }
  .nav svg { width: 17px; height: 17px; }
  .main { padding: 24px 28px; display: grid; grid-template-rows: auto auto 1fr; gap: 18px; min-width: 0; }
  .topline { display: flex; justify-content: space-between; align-items: center; }
  .topline h2 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .kpis { display: grid; grid-template-columns: 1.5fr repeat(3, 1fr); gap: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--cr); padding: 16px 18px; }
  .kpi small { color: var(--muted); font-size: 12.5px; }
  .kpi strong { display: block; font-size: 30px; letter-spacing: -0.02em; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; min-height: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--cr); padding: 16px 18px; min-height: 0; position: relative; overflow: hidden; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td, th { padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }


  /* page variants */
  .page.night { background: #101219; color: #e8eaf0; }
  .night .page-head p, .night .tag, .night .swatches small { color: #9aa1b2; }
  .night .shot figcaption { color: #d7dae3; }
  .night .shot figcaption span { color: #8c93a4; }
  .night .phone { box-shadow: 0 18px 40px rgba(0,0,0,.5); background: #000; }
  .night .desk { box-shadow: 0 24px 60px rgba(0,0,0,.55); border-color: rgba(255,255,255,.06); }
  .mode { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e4e7ee; color: #2a2f3a; margin-left: 8px; vertical-align: middle; }
  .night .mode { background: #232735; color: #e8eaf0; }

  /* direction-specific touches (both modes) */
  .B .sheet { backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
  .B .fab { backdrop-filter: blur(12px); border: 1px solid var(--line); }
  .B.dk .sheet { box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  .B.dk .btn { box-shadow: 0 0 24px rgba(142,168,255,.35); }
  .B.lt .btn { box-shadow: 0 8px 20px rgba(76,95,224,.3); }
  .B .kpi, .B .panel { backdrop-filter: blur(12px); }
  .C .h { font-size: 17px; letter-spacing: -0.02em; }
  .C .chip { border: 0; background: var(--p-soft); color: var(--p); }
  .C .chip.on { background: var(--p); color: var(--on-p); }
  .C .side { border-right: 1px solid var(--line); }
  .C .nav.on { color: var(--p); }
  .D .sheet { box-shadow: none; border-top: 1px solid var(--line); }
  .D .h { font-weight: 800; letter-spacing: -0.03em; }
  .D .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .D .ricon { background: transparent; border: 1.5px solid var(--line2); color: var(--ink); }
  .D .rcard.sel { box-shadow: none; border: 2px solid var(--ink); }
  .D .side { border-right: 1px solid var(--line); }
  .D .kpi strong { font-weight: 800; }

  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(15,20,40,.06); font-size: 12.5px; }
  .cmp th, .cmp td { padding: 10px 12px; border-bottom: 1px solid #eceef3; vertical-align: top; }
  .cmp th { background: #f1f3f7; color: #3b4150; }
  .note { margin-top: 14px; padding: 13px 16px; border-radius: 14px; background: #fff; box-shadow: 0 6px 20px rgba(15,20,40,.06); }
</style>
<style id="themes"></style>
</head>

const isDark = (t) => t.mode === "dk";
const riskOf = (t) => (isDark(t) ? RISK_DARK : RISK);

// a stylised coastal town; kind: plain | exposed | routes | alert | segment | rain
function mapSVG(t, kind, w = 270, h = 570, shift = 0) {
  const m = THEMES[t.id].map[t.mode];
  const R = riskOf(t);
  const dark = isDark(t);
  let s = `<svg class="map" viewBox="0 0 270 570" preserveAspectRatio="xMidYMid slice" width="${w}" height="${h}"><rect width="270" height="570" fill="${m.land}"/><g transform="translate(0 ${shift})">`;
  for (let y = 40; y < 470; y += 34) for (let x = 6; x < 270; x += 46) {
    if ((x * 7 + y * 3) % 11 === 0) continue;
    s += `<rect x="${x}" y="${y}" width="${36 + ((x + y) % 3) * 3}" height="${24 + (x % 2) * 3}" rx="3" fill="${m.block}"/>`;
  }
  s += `<path d="M150 70 h70 v55 h-70z" fill="${m.park}"/><path d="M14 380 h52 v40 h-52z" fill="${m.park}"/>`;
  s += `<path d="M0 470 C 70 440, 120 490, 180 455 S 250 420, 270 430 L270 760 L0 760Z" fill="${m.water}"/>`;
  ["M0 140 H270", "M0 208 H270", "M0 290 H270", "M0 360 H270", "M48 0 V470", "M140 0 V460", "M196 0 V440", "M96 30 V470", "M240 0 V430"].forEach(
    (d) => (s += `<path d="${d}" stroke="${m.road}" stroke-width="5" fill="none"/>`)
  );
  s += `<path d="M0 250 C 80 240, 160 262, 270 238" stroke="${m.major}" stroke-width="9" fill="none"/>`;
  s += `<path d="M0 418 C 70 400, 150 425, 270 395" stroke="${m.major}" stroke-width="9" fill="none"/>`;
  s += `<path d="M120 0 C 128 120, 112 300, 132 470" stroke="${dark ? "#3d7fb8" : "#7FB8E6"}" stroke-opacity=".6" stroke-width="3" fill="none"/>`;
  const exposed = () =>
    ["M20 432 L70 425", "M150 440 L205 428", "M110 392 L132 470", "M205 360 L250 352"].forEach(
      (d) => (s += `<path d="${d}" stroke="${R.exposed}" stroke-width="4" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/>`)
    );
  const red = () =>
    [["M20 432 L70 425", R.high], ["M150 440 L205 428", R.very], ["M110 392 L132 470", R.very], ["M205 360 L250 352", R.high], ["M70 360 L140 360", R.moderate], ["M196 290 L240 290", R.moderate], ["M96 300 L96 360", R.high]].forEach(
      ([d, c]) => (s += `<path d="${d}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>`)
    );
  const pin = (x, y, c) => (s += `<circle cx="${x}" cy="${y}" r="7" fill="${c}" stroke="${dark ? m.land : "#fff"}" stroke-width="3"/>`);
  if (kind === "exposed") exposed();
  if (kind === "routes" || kind === "alert") {
    if (kind === "alert") red(); else exposed();
    s += `<path d="M48 330 L48 360 L96 360 L96 418 L196 410 L196 360" stroke="${dark ? "#6b7690" : "#9aa6b5"}" stroke-width="6" stroke-dasharray="1 9" stroke-linecap="round" fill="none"/>`;
    s += `<path d="M48 330 L48 208 L196 208 L196 360" stroke="${dark ? m.land : "#fff"}" stroke-width="10" fill="none" stroke-linejoin="round"/>`;
    s += `<path d="M48 330 L48 208 L196 208 L196 360" stroke="${m.route}" stroke-width="6" fill="none" stroke-linejoin="round"/>`;
    pin(48, 330, "#16A34A"); pin(196, 360, m.route);
  }
  if (kind === "segment") {
    exposed();
    s += `<path d="M96 300 L96 360" stroke="${dark ? m.land : "#fff"}" stroke-width="12" stroke-linecap="round"/><path d="M96 300 L96 360" stroke="${R.high}" stroke-width="7" stroke-linecap="round"/>`;
    s += `<circle cx="96" cy="330" r="22" fill="${R.high}" fill-opacity=".15" stroke="${R.high}" stroke-opacity=".5"/>`;
  }
  s += "</g>";
  if (kind === "alert" || kind === "rain") {
    s += `<rect width="270" height="570" fill="#0b1530" fill-opacity="${dark ? 0.25 : 0.1}"/>`;
    for (let i = 0; i < 80; i++) {
      const x = (i * 53) % 280, y = (i * 97) % 580;
      s += `<line x1="${x}" y1="${y}" x2="${x - 4}" y2="${y + 14}" stroke="${dark ? "#c9d6ff" : "#6f88b8"}" stroke-opacity=".45" stroke-width="1.1"/>`;
    }
  }
  return s + "</svg>";
}

function admin(t) {
  const R = riskOf(t);

  const bars = Array.from({ length: 40 }, (_, i) => Math.max(0.3, 7 * Math.exp(-((i - 26) ** 2) / 40) + 3 * Math.exp(-((i - 11) ** 2) / 12)));
  const total = Array.from({ length: 40 }, (_, i) => 20 + 85 * Math.exp(-((i - 24) ** 2) / 120));
  const W = 560, H = 190, x = (i) => 36 + (i / 39) * (W - 50), y1 = (v) => 90 - (v / 8) * 70, y2 = (v) => 180 - (v / 110) * 80;
  let chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  bars.forEach((v, i) => (chart += `<rect x="${x(i) - 4}" y="${y1(v)}" width="8" height="${90 - y1(v)}" rx="2" fill="${dark ? "#5B7BFF" : "#3B82F6"}" opacity="${i < 25 ? 1 : 0.35}"/>`));
  chart += `<line x1="36" x2="${W - 14}" y1="${y2(44)}" y2="${y2(44)}" stroke="${R.very}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - 14}" y="${y2(44) - 5}" text-anchor="end" font-size="11" fill="${R.very}" font-weight="700" dy="16">seuil 44 mm</text>`;
  chart += `<path d="${total.map((v, i) => `${i ? "L" : "M"}${x(i)},${y2(v)}`).join("")}" fill="none" stroke="var(--p)" stroke-width="2.5"/>`;
  chart += `<text x="36" y="12" font-size="11" fill="var(--muted)">Pluie horaire (mm/h)</text><text x="36" y="108" font-size="11" fill="var(--muted)">Cumul 24 h (mm)</text></svg>`;

    <main class="main">

      <div class="kpis">
        <div class="kpi" style="background:${dark ? "rgba(251,72,104,.09)" : "#FFF1F3"};border-color:${R.very}44"><small style="color:${R.very};font-weight:700">● Alerte pluie active</small><strong>52 mm <span style="font-size:15px" class="muted">/ 44 mm en 24 h</span></strong><div class="gauge"><b style="width:78%;background:${R.very}"></b><i></i></div></div>
        <div class="kpi"><small>Utilisateurs</small><strong>1 248</strong></div>
        <div class="kpi"><small>Itinéraires aujourd'hui</small><strong>3 412</strong></div>

  }
  for (const mode of ["lt", "dk"]) {
    html += `<section class="page ${mode === "dk" ? "night" : ""}"><div class="page-head"><div><span class="tag">Style ${id} · tableau de bord admin</span><h1>${T.name} · admin<span class="mode">${MODE_LABEL[mode]}</span></h1><p>État de l'alerte, orage en cours avec le seuil de 44 mm, carte des routes en alerte et journal des événements.</p></div></div>
      <div style="display:grid;place-items:center">${admin({ id, mode })}</div></section>`;

}
